<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- NMIXX 首屏主角：浮在浪上、尾巴翹起的白色鯨魚
       設計依據：官方手燈中的白色鯨魚與寶藍色水（原創詮釋，不複製手燈本體造型） -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f3f7fc"/>
      <stop offset="1" stop-color="#c9d8ea"/>
    </linearGradient>
  </defs>
  <!-- 翹起的尾鰭 -->
  <path fill="url(#body)" d="M330 84 C316 64 292 50 266 48 C284 66 300 78 320 90 Z"/>
  <path fill="url(#body)" d="M334 84 C346 60 366 44 392 38 C382 62 364 78 342 92 Z"/>
  <!-- 圓潤的身體：頭在左、尾柄往右上翹 -->
  <path fill="url(#body)" d="M36 166 C32 118 86 90 160 90 C222 90 266 112 290 136 C304 118 316 100 326 80 L340 84 C336 110 328 138 316 162 C300 192 250 208 168 208 C94 208 40 200 36 166 Z"/>
  <!-- 背上的光澤 -->
  <path fill="#ffffff" opacity="0.95" d="M84 118 C110 102 160 98 204 106 C170 108 128 114 96 128 Z"/>
  <!-- 肚子的淡藍灰陰影 -->
  <path fill="#b9cbe0" opacity="0.6" d="M54 186 C100 200 200 204 270 190 C250 204 210 210 168 210 C110 210 70 202 54 186 Z"/>
  <!-- 胸鰭 -->
  <path fill="#dfe8f3" d="M150 184 C138 204 118 216 96 220 C112 204 124 192 132 180 Z"/>
  <!-- 眼睛與微笑 -->
  <circle cx="84" cy="150" r="6.5" fill="#0f2a6b"/>
  <circle cx="85.8" cy="148.2" r="2" fill="#ffffff"/>
  <path fill="none" stroke="#8fa6c4" stroke-width="3" stroke-linecap="round" d="M40 168 C62 176 88 178 112 172"/>
  <!-- 噴氣孔 -->
  <ellipse cx="128" cy="92" rx="9" ry="3.5" fill="#9fb6d3"/>
</svg>
